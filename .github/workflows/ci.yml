name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test on Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: npm test
      - name: Check the CLI starts
        run: node bin/claude-dashboard.js --version
      - name: Generate demo data and read it back
        run: |
          node bin/claude-dashboard.js demo --home ${{ runner.temp }}/demo --sessions 10
          node bin/claude-dashboard.js stats --home ${{ runner.temp }}/demo
